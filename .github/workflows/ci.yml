name: CI
run-name: "CI ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""


permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  commit_lint:
    if: false   # racecar: scan/report job, not a build
    runs-on: ubuntu-latest
    steps:
      # Check commit messages
      - uses: webiny/action-conventional-commits@v1.1.0

  stylua:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - name: Download stylua
        run: make stylua

      - name: Lint
        run: make stylua-check

  luals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - uses: lewis6991/gh-actions-lua@master
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Download nvim-test
        run: make nvim-test

      - name: LuaLS
        run: make luals-check

  tsqueryls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - name: Download tsqueryls
        run: make tsqueryls

      - name: Lint
        run: make tsqueryls-lint

      - name: Format
        continue-on-error: true   # racecar: scan/report/push step, must not fail the build
        if: always()
        run: |
          make tsqueryls-format
          git diff --exit-code

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        neovim_version:
          - 'v0.11.5'

    env:
      NVIM_TEST_VERSION: ${{ matrix.neovim_version }}

    steps:
      - name: Checkout
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        continue-on-error: true
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
      - uses: lewis6991/gh-actions-lua@master
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@v4

      - uses: tree-sitter/setup-action/cli@v2

      - name: Download nvim-test
        run: make nvim-test

      - name: Download nvim-treesitter
        run: make nvim-treesitter

      - name: Parsers Cache
        id: parsers-cache
        uses: actions/cache@v4
        with:
          path: deps/nvim-treesitter-data
          key: parsers-${{ join(matrix.*, '-') }}-${{ hashFiles(
            './deps/nvim-treesitter/lua/nvim-treesitter/parsers.lua') }}

      - name: Install parsers
        if: steps.parsers-cache.outputs.cache-hit != 'true'
        run: make parsers

      - name: Run Test
        run: make test

      - name: README up to date
        run: git diff --exit-code -- README.md

      - name: Download tsqueryls
        run: make tsqueryls

      - name: Validate queries
        run: make tsqueryls-check
