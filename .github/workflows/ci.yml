            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        neovim_version:
        - 'v0.11.5'

    env:
      NVIM_TEST_VERSION: ${{ matrix.neovim_version }}

    steps:
    - name: Checkout
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
    - uses: lewis6991/gh-actions-lua@master
      with:
        luaVersion: "5.1.5"

    - uses: leafo/gh-actions-luarocks@v4

    - uses: tree-sitter/setup-action/cli@v2

    - name: Download nvim-test
      run: make nvim-test

    - name: Download nvim-treesitter
      run: make nvim-treesitter

    - name: Parsers Cache
      id: parsers-cache
      uses: actions/cache@v4
      with:
        path: deps/nvim-treesitter-data
        key: parsers-${{ join(matrix.*, '-') }}-${{ hashFiles( './deps/nvim-treesitter/lua/nvim-treesitter/parsers.lua') }}

    - name: Install parsers
      if: steps.parsers-cache.outputs.cache-hit != 'true'
      run: make parsers

    - name: Run Test
      run: make test

    - name: README up to date
      run: git diff --exit-code -- README.md

    - name: Download tsqueryls
      run: make tsqueryls

    - name: Validate queries
      run: make tsqueryls-check
    - name: Check observables and crashes
